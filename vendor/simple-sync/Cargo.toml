[package]
name = "simple-sync"
version = "0.1.0"
edition = "2021"
description = "Zero-server P2P document and state synchronization for agent-built apps."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dominic-Pi-Sunyer/simple-sync"
readme = "README.md"
keywords = ["p2p", "sync", "collaboration", "e2ee", "iroh"]
categories = ["network-programming", "cryptography"]

[dependencies]
# Networking & Blobs (latest releases at time of writing; iroh 1.x line)
iroh = "1.3"
iroh-gossip = "0.101"
iroh-blobs = "0.103"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time"] }
futures-lite = "2"

# CRDT & Serialization
loro = "1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.7"

# Security & Tickets
chacha20poly1305 = "0.10"
rand = "0.8"
data-encoding = "2.6" # Base64url encoding for ssync:// tickets
blake3 = "1.5"
anyhow = "1.0"
serde_json = "1"
ed25519-dalek = "3.0.0"
zeroize = "1.9.1"
